baseURL = "https://andreaspark.com/"
languageCode = "en-us"
title = "Andreas Park"
theme = "PaperMod"
[pagination]
  pagerSize = 10
enableRobotsTXT = true

[params]
  author = "Andreas Park"
  description = "Professor of Finance at the University of Toronto — Research on financial market structure, FinTech, blockchain, and DeFi."
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  images = ["/images/social-preview.png"]

  [params.assets]
    favicon = "/icons/ap-v2.ico"
    favicon16x16 = "/icons/ap-v2-16.png"
    favicon32x32 = "/icons/ap-v2-32.png"
    apple_touch_icon = "/icons/ap-v2-apple.png"
    safari_pinned_tab = "/icons/ap-pinned-v2.svg"

  [params.homeInfoParams]
    Title = "Andreas Park"
    Content = ""

  [params.profileMode]
    enabled = true
    title = "Andreas Park"
    subtitle = """Professor of Finance · University of Toronto\n\nRotman School of Management · Department of Management, UTM\n\nAcademic Director, [FinHub](https://www.rotman.utoronto.ca/finhub)"""
    imageUrl = "images/comicAP.png"
    imageWidth = 250
    imageHeight = 375
    imageTitle = "Andreas Park"

    [[params.profileMode.buttons]]
      name = "Research"
      url = "/research/"
    [[params.profileMode.buttons]]
      name = "CV"
      url = "/cv.pdf"
    [[params.profileMode.buttons]]
      name = "Teaching"
      url = "/teaching/"

    [[params.profileMode.buttons]]
      name = "Bio"
      url = "/bio/"

  [params.giscus]
    enabled = true
    repo = "andreas-park/personalwebsite"
    repoID = "REPLACE_WITH_REPO_ID"
    category = "Announcements"
    categoryID = "REPLACE_WITH_CATEGORY_ID"
    mapping = "pathname"
    reactionsEnabled = "1"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "en"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/financeutm"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/andreaspark/"
  [[params.socialIcons]]
    name = "googlescholar"
    url = "https://scholar.google.com/citations?user=d68d39AAAAAJ"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:andreas.park@rotman.utoronto.ca"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://youtube.com/user/andreaspark2812/"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/andreas-park"

